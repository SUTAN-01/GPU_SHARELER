<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时资源监控 - GPU共享池</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        .nav-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            margin-bottom: 20px;
            transition: background 0.3s;
        }
        .nav-link:hover {
            background: rgba(255,255,255,0.3);
        }
        .status-indicator {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-left: 15px;
        }
        .status-connected {
            background: #10b981;
            color: white;
        }
        .status-disconnected {
            background: #ef4444;
            color: white;
        }

        /* 汇总卡片 */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .summary-card:hover {
            transform: translateY(-5px);
        }
        .summary-card h3 {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .summary-card .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1f2937;
        }
        .summary-card .subvalue {
            font-size: 1rem;
            color: #9ca3af;
            margin-top: 8px;
        }
        .gpu-card .value { color: #8b5cf6; }
        .cpu-card .value { color: #3b82f6; }
        .node-card .value { color: #10b981; }
        .task-card .value { color: #f59e0b; }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e5e7eb;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 12px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #6366f1);
            transition: width 0.5s ease;
            border-radius: 6px;
        }

        /* 节点列表 */
        .section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #1f2937;
        }
        .node-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        .node-item {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            transition: border-color 0.3s;
        }
        .node-item.online {
            border-color: #10b981;
            background: #ecfdf5;
        }
        .node-item.offline {
            border-color: #ef4444;
            background: #fef2f2;
            opacity: 0.6;
        }
        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .node-name {
            font-weight: bold;
            color: #1f2937;
        }
        .node-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .node-status.online {
            background: #10b981;
            color: white;
        }
        .node-status.offline {
            background: #ef4444;
            color: white;
        }
        .node-resources {
            font-size: 0.9rem;
            color: #6b7280;
            line-height: 1.8;
        }
        .resource-bar {
            display: flex;
            align-items: center;
            margin-top: 8px;
        }
        .resource-bar .label {
            width: 80px;
            font-weight: 600;
            color: #374151;
            font-size: 0.85rem;
        }
        .resource-bar .bar {
            flex: 1;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin: 0 8px;
        }
        .resource-bar .bar-fill {
            height: 100%;
            transition: width 0.5s ease;
        }
        .resource-bar .bar-fill.gpu {
            background: #8b5cf6;
        }
        .resource-bar .bar-fill.cpu {
            background: #3b82f6;
        }
        .resource-bar .count {
            font-size: 0.85rem;
            color: #6b7280;
            min-width: 60px;
            text-align: right;
        }

        /* 任务列表 */
        .task-list {
            list-style: none;
        }
        .task-item {
            border-left: 4px solid #6366f1;
            background: #f9fafb;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .task-name {
            font-weight: 600;
            color: #1f2937;
        }
        .task-status {
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .task-status.running { background: #10b981; color: white; }
        .task-status.partial { background: #f59e0b; color: white; }
        .task-status.queued { background: #6b7280; color: white; }
        .task-status.completed { background: #3b82f6; color: white; }
        .task-progress {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }
        .task-progress-fill {
            height: 100%;
            background: #6366f1;
            transition: width 0.3s ease;
        }

        .timestamp {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="nav-link">← 返回主界面</a>

        <h1>
            🖥️ 实时资源监控
            <span id="status" class="status-indicator status-disconnected">连接中...</span>
        </h1>

        <!-- 汇总统计 -->
        <div class="summary-grid">
            <div class="summary-card gpu-card">
                <h3>🎮 GPU资源</h3>
                <div class="value" id="gpu-usage">0 / 0</div>
                <div class="subvalue">可用: <span id="gpu-available">0</span></div>
                <div class="progress-bar">
                    <div class="progress-fill" id="gpu-progress" style="width: 0%"></div>
                </div>
            </div>

            <div class="summary-card cpu-card">
                <h3>⚡ CPU资源</h3>
                <div class="value" id="cpu-usage">0 / 0</div>
                <div class="subvalue">可用: <span id="cpu-available">0</span></div>
                <div class="progress-bar">
                    <div class="progress-fill" id="cpu-progress" style="width: 0%"></div>
                </div>
            </div>

            <div class="summary-card node-card">
                <h3>🌐 在线节点</h3>
                <div class="value" id="node-count">0 / 0</div>
                <div class="subvalue">设备节点数</div>
            </div>

            <div class="summary-card task-card">
                <h3>📊 运行任务</h3>
                <div class="value" id="task-count">0</div>
                <div class="subvalue">总任务: <span id="total-tasks">0</span></div>
            </div>
        </div>

        <!-- 节点详情 -->
        <div class="section">
            <h2>节点状态</h2>
            <div class="node-grid" id="node-list">
                <p style="color: #6b7280;">等待数据...</p>
            </div>
        </div>

        <!-- 运行中的任务 -->
        <div class="section">
            <h2>运行中的任务</h2>
            <ul class="task-list" id="task-list">
                <li style="color: #6b7280;">暂无任务</li>
            </ul>
        </div>

        <div class="timestamp">
            最后更新: <span id="last-update">--</span>
        </div>
    </div>

    <script>
        let eventSource = null;

        function connect() {
            eventSource = new EventSource('/api/events');

            eventSource.onopen = function() {
                document.getElementById('status').textContent = '🟢 已连接';
                document.getElementById('status').className = 'status-indicator status-connected';
            };

            eventSource.onerror = function() {
                document.getElementById('status').textContent = '🔴 连接断开';
                document.getElementById('status').className = 'status-indicator status-disconnected';
                eventSource.close();
                setTimeout(connect, 3000); // 3秒后重连
            };

            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                updateUI(data);
            };
        }

        function updateUI(data) {
            const summary = data.summary;

            // 更新汇总统计
            document.getElementById('gpu-usage').textContent = `${summary.usedGpu} / ${summary.totalGpu}`;
            document.getElementById('gpu-available').textContent = summary.availableGpu;
            document.getElementById('gpu-progress').style.width =
                summary.totalGpu > 0 ? `${(summary.usedGpu / summary.totalGpu * 100).toFixed(1)}%` : '0%';

            document.getElementById('cpu-usage').textContent = `${summary.usedCpu} / ${summary.totalCpu}`;
            document.getElementById('cpu-available').textContent = summary.availableCpu;
            document.getElementById('cpu-progress').style.width =
                summary.totalCpu > 0 ? `${(summary.usedCpu / summary.totalCpu * 100).toFixed(1)}%` : '0%';

            document.getElementById('node-count').textContent = `${summary.onlineNodes} / ${summary.totalNodes}`;
            document.getElementById('task-count').textContent = summary.runningTasks;
            document.getElementById('total-tasks').textContent = summary.totalTasks;

            // 更新节点列表
            const nodeList = document.getElementById('node-list');
            if (data.nodes && data.nodes.length > 0) {
                nodeList.innerHTML = data.nodes.map(node => `
                    <div class="node-item ${node.status}">
                        <div class="node-header">
                            <span class="node-name">${escapeHtml(node.name)}</span>
                            <span class="node-status ${node.status}">${node.status === 'online' ? '在线' : '离线'}</span>
                        </div>
                        <div class="node-resources">
                            <div>👤 ${escapeHtml(node.ownerName)}</div>
                            <div>💻 ${escapeHtml(node.platform)}</div>
                            ${node.gpuName ? `<div>🎮 ${escapeHtml(node.gpuName)}</div>` : ''}
                        </div>
                        ${node.gpuSlots > 0 ? `
                        <div class="resource-bar">
                            <span class="label">GPU槽位</span>
                            <div class="bar">
                                <div class="bar-fill gpu" style="width: ${(node.gpuUsed / node.gpuSlots * 100).toFixed(1)}%"></div>
                            </div>
                            <span class="count">${node.gpuUsed} / ${node.gpuSlots}</span>
                        </div>
                        ${node.gpuMemoryUsedGb !== undefined && node.memoryGb > 0 ? `
                        <div class="resource-bar">
                            <span class="label">显存</span>
                            <div class="bar">
                                <div class="bar-fill gpu" style="width: ${(node.gpuMemoryUsedGb / node.memoryGb * 100).toFixed(1)}%"></div>
                            </div>
                            <span class="count">${node.gpuMemoryUsedGb.toFixed(1)} / ${node.memoryGb} GB</span>
                        </div>
                        ` : ''}
                        ${node.gpuUtilizationPercent !== undefined ? `
                        <div class="resource-bar">
                            <span class="label">GPU利用率</span>
                            <div class="bar">
                                <div class="bar-fill gpu" style="width: ${node.gpuUtilizationPercent}%"></div>
                            </div>
                            <span class="count">${node.gpuUtilizationPercent}%</span>
                        </div>
                        ` : ''}
                        ` : ''}
                        <div class="resource-bar">
                            <span class="label">CPU槽位</span>
                            <div class="bar">
                                <div class="bar-fill cpu" style="width: ${(node.cpuUsed / node.cpuSlots * 100).toFixed(1)}%"></div>
                            </div>
                            <span class="count">${node.cpuUsed} / ${node.cpuSlots}</span>
                        </div>
                        ${node.cpuPercent !== undefined ? `
                        <div class="resource-bar">
                            <span class="label">CPU利用率</span>
                            <div class="bar">
                                <div class="bar-fill cpu" style="width: ${node.cpuPercent}%"></div>
                            </div>
                            <span class="count">${node.cpuPercent.toFixed(1)}%</span>
                        </div>
                        ` : ''}
                        ${node.memoryUsedGb !== undefined && node.memoryTotalGb > 0 ? `
                        <div class="resource-bar">
                            <span class="label">内存</span>
                            <div class="bar">
                                <div class="bar-fill cpu" style="width: ${(node.memoryUsedGb / node.memoryTotalGb * 100).toFixed(1)}%"></div>
                            </div>
                            <span class="count">${node.memoryUsedGb.toFixed(1)} / ${node.memoryTotalGb.toFixed(1)} GB</span>
                        </div>
                        ` : ''}
                    </div>
                `).join('');
            } else {
                nodeList.innerHTML = '<p style="color: #6b7280;">暂无节点</p>';
            }

            // 更新任务列表
            const taskList = document.getElementById('task-list');
            const runningTasks = data.tasks ? data.tasks.filter(t => ['running', 'partial'].includes(t.status)) : [];
            if (runningTasks.length > 0) {
                taskList.innerHTML = runningTasks.map(task => `
                    <li class="task-item">
                        <div class="task-header">
                            <span class="task-name">${escapeHtml(task.name)}</span>
                            <span class="task-status ${task.status}">
                                ${task.status === 'running' ? '运行中' : task.status === 'partial' ? '部分运行' : '排队中'}
                            </span>
                        </div>
                        <div style="font-size: 0.85rem; color: #6b7280;">
                            ${escapeHtml(task.requesterName)} · ${task.allocatedWorkers}/${task.workers} workers · ${task.framework}
                        </div>
                        <div class="task-progress">
                            <div class="task-progress-fill" style="width: ${task.progress || 0}%"></div>
                        </div>
                    </li>
                `).join('');
            } else {
                taskList.innerHTML = '<li style="color: #6b7280;">暂无运行中的任务</li>';
            }

            // 更新时间戳
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString('zh-CN');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 启动连接
        connect();
    </script>
</body>
</html>
